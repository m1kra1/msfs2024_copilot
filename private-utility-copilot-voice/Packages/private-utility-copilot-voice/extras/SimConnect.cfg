; Client config for MSFS 2024 (matches typical LocalCache SimConnect.xml)
; Server on this machine uses IPv4 Port 500 (see %APPDATA%\Microsoft Flight Simulator 2024\SimConnect.xml)

[SimConnect]
Protocol=IPv4
Address=127.0.0.1
Port=500
MaxReceiveSize=41088
DisableNagle=0

[SimConnect.1]
Protocol=Pipe
Address=localhost
Port=Custom\SimConnect
MaxReceiveSize=41088
DisableNagle=0

[SimConnect.2]
Protocol=IPv6
Address=::1
Port=501
MaxReceiveSize=41088
DisableNagle=0

[SimConnect.3]
Protocol=Auto
MaxReceiveSize=41088
DisableNagle=0
